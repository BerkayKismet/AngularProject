<form
  novalidate
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <div class="row g-3 mb-2">
    <div class="col-12 mb-4">
      <div class="d-flex justify-content-center mb-3">
        <app-google-signin-button
          (pressed)="onGoogleSignIn()"
        ></app-google-signin-button>
      </div>

      <div class="divider divider--upper d-flex align-items-center w-100 my-4">
        <span class="divider-line" aria-hidden="true"></span>
        <small class="divider-text text-secondary px-3 fw-semibold text-nowrap">{{
          'register.or' | transloco
        }}</small>
        <span class="divider-line" aria-hidden="true"></span>
      </div>
    </div>

    <div class="form-group col-12 col-xl-6">
      <app-auth-input
        [control]="form.controls.firstName"
        inputId="reg-first-name"
        labelKey="register.firstName"
        autocomplete="given-name"
      ></app-auth-input>
    </div>

    <div class="form-group col-12 col-xl-6">
      <app-auth-input
        [control]="form.controls.lastName"
        inputId="reg-last-name"
        labelKey="register.lastName"
        autocomplete="family-name"
      ></app-auth-input>
    </div>

    <div class="form-group col-12 col-xl-6">
      <app-auth-input
        [control]="form.controls.email"
        inputId="reg-email"
        labelKey="register.email"
        type="email"
        autocomplete="email"
      ></app-auth-input>
    </div>

    <div class="form-group col-12 col-xl-6">
      <app-auth-input
        [control]="form.controls.phone"
        inputId="reg-phone"
        labelKey="register.phone"
        type="tel"
        autocomplete="tel"
      ></app-auth-input>
    </div>

    <div class="form-group col-12">
      <app-password-field
        [control]="form.controls.password"
        inputId="reg-password"
        autocomplete="new-password"
      ></app-password-field>
    </div>

    <div
      class="col-12 form-check-container mt-3 mb-4 p-4"
      role="group"
      [attr.aria-label]="'register.consentsLegend' | transloco"
    >
      <app-register-consents variant="modal"></app-register-consents>
    </div>

    <div class="corporate-cta col-12 my-4 p-3">
      <a
        class="text-end text-decoration-none"
        [routerLink]="corporateRegisterCommands"
      >
        <span class="text-primary d-inline-block border-bottom border-primary">
          {{ 'register.corporateCta' | transloco }}
          <i class="icon-arrow-right fs-18 me-1" aria-hidden="true">&#xf111;</i>
        </span>
      </a>
    </div>

    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a
          class="btn btn-auth btn-auth-gold"
          [routerLink]="loginLink"
          [skipLocationChange]="skipLocationChange"
        >
          <i class="icon-arrow-left" aria-hidden="true">&#xf110;</i>
          <span>{{ 'register.login' | transloco }}</span>
        </a>

        <button type="submit" class="btn btn-auth btn-auth-primary">
          <span>{{ 'register.submit' | transloco }}</span>
          <i class="icon-sign-in-alt" aria-hidden="true">&#xf1a8;</i>
        </button>
      </div>
    </div>
  </div>
</form>
