<app-google-signin-button (pressed)="onGoogleSignIn()"></app-google-signin-button>

<div class="divider d-flex align-items-center gap-3 my-4">
  <hr />
  <span class="divider-label text-secondary small">{{
    'register.or' | translate
  }}</span>
  <hr />
</div>

<form
  class="d-flex flex-column gap-3"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <label class="visually-hidden" for="reg-first-name">{{
        'register.firstName' | translate
      }}</label>
      <input
        id="reg-first-name"
        class="form-control form-control-auth"
        type="text"
        formControlName="firstName"
        [attr.placeholder]="'register.firstName' | translate"
        autocomplete="given-name"
      />
    </div>

    <div class="col-12 col-sm-6">
      <label class="visually-hidden" for="reg-last-name">{{
        'register.lastName' | translate
      }}</label>
      <input
        id="reg-last-name"
        class="form-control form-control-auth"
        type="text"
        formControlName="lastName"
        [attr.placeholder]="'register.lastName' | translate"
        autocomplete="family-name"
      />
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <label class="visually-hidden" for="reg-email">{{
        'register.email' | translate
      }}</label>
      <input
        id="reg-email"
        class="form-control form-control-auth"
        type="email"
        formControlName="email"
        [attr.placeholder]="'register.email' | translate"
        autocomplete="email"
      />
    </div>

    <div class="col-12 col-sm-6">
      <label class="visually-hidden" for="reg-phone">{{
        'register.phone' | translate
      }}</label>
      <input
        id="reg-phone"
        class="form-control form-control-auth"
        type="tel"
        formControlName="phone"
        [attr.placeholder]="'register.phone' | translate"
        autocomplete="tel"
      />
    </div>
  </div>

  <app-password-field
    [control]="form.controls.password"
    inputId="reg-password"
    autocomplete="new-password"
  ></app-password-field>

  <fieldset class="consents d-flex flex-column gap-2 m-0 p-3">
    <legend class="visually-hidden">{{
      'register.consentsLegend' | translate
    }}</legend>

    <label class="consent-item d-flex align-items-start gap-2 m-0">
      <input
        class="consent-check"
        type="checkbox"
        formControlName="termsAccepted"
      />
      <small class="consent-text">
        {{ 'register.terms.prefix' | translate }}
        <button type="button" class="consent-link">{{
          'register.terms.cookie' | translate
        }}</button
        >,
        <button type="button" class="consent-link">{{
          'register.terms.security' | translate
        }}</button
        >,
        <button type="button" class="consent-link">{{
          'register.terms.membership' | translate
        }}</button
        >,
        <button type="button" class="consent-link">{{
          'register.terms.potentialUser' | translate
        }}</button
        >,
        <button type="button" class="consent-link">{{
          'register.terms.portal' | translate
        }}</button
        >{{ 'register.terms.suffix' | translate }}
      </small>
    </label>

    <label class="consent-item d-flex align-items-start gap-2 m-0">
      <input
        class="consent-check"
        type="checkbox"
        formControlName="marketingAccepted"
      />
      <small class="consent-text">{{
        'register.marketing' | translate
      }}</small>
    </label>

    <label class="consent-item d-flex align-items-start gap-2 m-0">
      <input
        class="consent-check"
        type="checkbox"
        formControlName="surveyAccepted"
      />
      <small class="consent-text">{{ 'register.survey' | translate }}</small>
    </label>
  </fieldset>

  <button
    type="button"
    class="corporate-cta d-flex flex-column w-100 text-start gap-2"
    (click)="onCorporateAccount()"
  >
    <span class="corporate-cta__text">{{
      'register.corporateCta' | translate
    }}</span>
    <span
      class="corporate-cta__footer d-flex justify-content-end align-items-center pt-2"
    >
      <app-icon name="chevron-right" class="corporate-cta__arrow"></app-icon>
    </span>
  </button>

  <div
    class="auth-actions d-flex flex-column flex-sm-row-reverse justify-content-sm-between align-items-stretch align-items-sm-center gap-2 gap-sm-3"
  >
    <button type="submit" class="btn btn-auth btn-auth-primary">
      {{ 'register.submit' | translate }}
      <app-icon name="login" class="btn-icon btn-icon--login"></app-icon>
    </button>

    <a
      class="btn btn-auth btn-auth-gold"
      [routerLink]="loginLink"
      [skipLocationChange]="skipLocationChange"
    >
      <app-icon name="chevron-left" class="btn-icon"></app-icon>
      {{ 'register.login' | translate }}
    </a>
  </div>
</form>
