<app-google-signin-button
  (pressed)="onGoogleSignIn()"
></app-google-signin-button>

<div class="divider d-flex align-items-center gap-3 my-4">
  <hr />
  <span class="divider-label text-secondary small">{{
    'register.or' | transloco
  }}</span>
  <hr />
</div>

<form
  class="d-flex flex-column gap-3"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <app-auth-input
        [control]="form.controls.firstName"
        inputId="reg-first-name"
        labelKey="register.firstName"
        autocomplete="given-name"
      ></app-auth-input>
    </div>

    <div class="col-12 col-sm-6">
      <app-auth-input
        [control]="form.controls.lastName"
        inputId="reg-last-name"
        labelKey="register.lastName"
        autocomplete="family-name"
      ></app-auth-input>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <app-auth-input
        [control]="form.controls.email"
        inputId="reg-email"
        labelKey="register.email"
        type="email"
        autocomplete="email"
      ></app-auth-input>
    </div>

    <div class="col-12 col-sm-6">
      <app-auth-input
        [control]="form.controls.phone"
        inputId="reg-phone"
        labelKey="register.phone"
        type="tel"
        autocomplete="tel"
      ></app-auth-input>
    </div>
  </div>

  <app-password-field
    [control]="form.controls.password"
    inputId="reg-password"
    autocomplete="new-password"
  ></app-password-field>

  <app-register-consents variant="boxed"></app-register-consents>

  <a
    class="corporate-cta d-flex flex-column w-100 text-start gap-2 text-decoration-none"
    routerLink="/corporate-register"
  >
    <span class="corporate-cta__text">{{
      'register.corporateCta' | transloco
    }}</span>
    <span
      class="corporate-cta__footer d-flex justify-content-end align-items-center pt-2"
    >
      <app-icon name="chevron-right" class="corporate-cta__arrow"></app-icon>
    </span>
  </a>

  <div
    class="auth-actions d-flex flex-column flex-sm-row-reverse justify-content-sm-between align-items-stretch align-items-sm-center gap-2 gap-sm-3"
  >
    <button type="submit" class="btn btn-auth btn-auth-primary">
      {{ 'register.submit' | transloco }}
      <app-icon name="login" class="btn-icon btn-icon--login"></app-icon>
    </button>

    <a
      class="btn btn-auth btn-auth-gold"
      [routerLink]="loginLink"
      [skipLocationChange]="skipLocationChange"
    >
      <app-icon name="chevron-left" class="btn-icon"></app-icon>
      {{ 'register.login' | transloco }}
    </a>
  </div>
</form>
