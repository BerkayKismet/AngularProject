<div class="auth-page d-flex justify-content-center align-items-center">
  <div
    *ngIf="isModal"
    class="auth-backdrop"
    aria-hidden="true"
    (click)="close()"
  ></div>
  <div
    class="auth-card position-relative overflow-hidden"
    role="dialog"
    [attr.aria-label]="'auth.dialog' | transloco"
    [attr.aria-modal]="isModal ? true : null"
  >
    <button
      *ngIf="isModal"
      type="button"
      class="auth-close position-absolute d-flex align-items-center justify-content-center rounded-circle border-0 p-0 lh-1"
      [attr.aria-label]="'auth.close' | transloco"
      (click)="close()"
    >
      <i class="icon-times" aria-hidden="true">&#xf1c3;</i>
    </button>

    <div class="auth-header d-flex justify-content-center align-items-center">
      <nav
        class="auth-toggle position-relative d-flex rounded-pill"
        [attr.aria-label]="'auth.dialog' | transloco"
      >
        <a
          [routerLink]="loginCommands"
          [skipLocationChange]="isModal"
          class="auth-toggle__btn d-inline-flex align-items-center justify-content-center text-decoration-none text-nowrap rounded-pill"
          [class.auth-toggle__btn--active]="!isRegister"
        >
          <span>{{ 'auth.login' | transloco }}</span>
        </a>
        <a
          [routerLink]="registerCommands"
          [skipLocationChange]="isModal"
          class="auth-toggle__btn d-inline-flex align-items-center justify-content-center text-decoration-none text-nowrap rounded-pill"
          [class.auth-toggle__btn--active]="isRegister"
        >
          <span>{{ 'auth.freeRegister' | transloco }}</span>
        </a>
        <div
          class="auth-toggle__slider rounded-pill"
          [class.auth-toggle__slider--right]="isRegister"
        ></div>
      </nav>
    </div>

    <div
      #authSlide
      class="auth-body overflow-hidden"
      [class.auth-body--register]="isRegister"
    >
      <div
        class="auth-track d-flex align-items-start h-100"
        [class.auth-track--register]="isRegister"
      >
        <section
          #loginPanel
          class="auth-panel w-50 flex-shrink-0 d-flex flex-column"
          [attr.aria-hidden]="isRegister"
          [attr.inert]="isRegister ? '' : null"
        >
          <div class="auth-form-surface">
            <app-login
              [registerLink]="registerCommands"
              [skipLocationChange]="isModal"
            ></app-login>
          </div>
        </section>
        <section
          #registerPanel
          class="auth-panel auth-panel--register w-50 flex-shrink-0 d-flex flex-column"
          [attr.aria-hidden]="!isRegister"
          [attr.inert]="!isRegister ? '' : null"
        >
          <div class="auth-form-surface">
            <app-register
              [loginLink]="loginCommands"
              [skipLocationChange]="isModal"
            ></app-register>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
