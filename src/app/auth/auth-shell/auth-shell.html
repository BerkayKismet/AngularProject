<div
  class="auth-page d-flex justify-content-center align-items-center"
  (click)="onBackdropClick($event)"
>
  <div
    class="auth-card position-relative overflow-hidden bg-white"
    role="dialog"
    [attr.aria-label]="'auth.dialog' | transloco"
    [attr.aria-modal]="isModal ? true : null"
  >
    <div
      class="auth-card-header d-flex align-items-center gap-2 mb-4 pb-3 border-bottom"
    >
      <nav
        class="tabs d-flex gap-1 p-1 flex-grow-1 min-w-0"
        [attr.aria-label]="'auth.dialog' | transloco"
      >
        <a
          [routerLink]="loginCommands"
          [skipLocationChange]="isModal"
          class="tab d-inline-flex align-items-center justify-content-center text-center text-decoration-none fw-semibold"
          [class.tab--active]="!isRegister"
        >
          {{ 'auth.login' | transloco }}
        </a>
        <a
          [routerLink]="registerCommands"
          [skipLocationChange]="isModal"
          class="tab d-inline-flex align-items-center justify-content-center text-center text-decoration-none fw-semibold"
          [class.tab--active]="isRegister"
        >
          {{ 'auth.freeRegister' | transloco }}
        </a>
      </nav>

      <button
        *ngIf="isModal"
        type="button"
        class="close-btn rounded-circle p-0 border-0 flex-shrink-0 d-inline-flex align-items-center justify-content-center"
        [attr.aria-label]="'auth.close' | transloco"
        (click)="close()"
      >
        <app-icon name="close"></app-icon>
      </button>
    </div>

    <div
      #authSlide
      class="auth-slide"
      [class.auth-slide--ready]="heightReady"
      [class.auth-slide--register]="isRegister"
      [style.height.px]="slideHeight"
    >
      <div
        class="auth-slide__track"
        [class.auth-slide__track--register]="isRegister"
      >
        <section
          #loginPanel
          class="auth-slide__panel"
          [attr.aria-hidden]="isRegister"
          [attr.inert]="isRegister ? '' : null"
        >
          <app-login
            [registerLink]="registerCommands"
            [skipLocationChange]="isModal"
          ></app-login>
        </section>
        <section
          #registerPanel
          class="auth-slide__panel auth-slide__panel--register"
          [attr.aria-hidden]="!isRegister"
          [attr.inert]="!isRegister ? '' : null"
        >
          <app-register
            [loginLink]="loginCommands"
            [skipLocationChange]="isModal"
          ></app-register>
        </section>
      </div>
    </div>
  </div>
</div>
