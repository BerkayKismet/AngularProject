<div class="position-relative">
  <label class="visually-hidden" [attr.for]="inputId">{{
    'password.label' | transloco
  }}</label>
  <input
    class="pe-5"
    [ngClass]="inputClass"
    [id]="inputId"
    [type]="visibility.checked ? 'text' : 'password'"
    [formControl]="control"
    [attr.autocomplete]="autocomplete"
    [attr.placeholder]="'password.placeholder' | transloco"
  />
  <!-- (change)="0": checkbox'ta Angular dinleyicisi yoksa change detection çalışmaz;
       [type] ve aria-label bağlamalarının güncellenmesi için gerekli. -->
  <input
    #visibility
    type="checkbox"
    class="pwd-vis"
    (change)="0"
    [attr.aria-label]="
      (visibility.checked ? 'password.hide' : 'password.show') | transloco
    "
  />
  <span class="eye-icons d-flex" aria-hidden="true">
    <i class="eye-on icon-eye">&#xf14a;</i>
    <i class="eye-off icon-eye-slash">&#xf149;</i>
  </span>
</div>
