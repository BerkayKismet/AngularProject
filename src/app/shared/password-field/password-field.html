<div class="position-relative">
  <label class="visually-hidden" [attr.for]="inputId">{{
    'password.label' | transloco
  }}</label>
  <input
    class="form-control form-control-auth pe-5"
    [id]="inputId"
    [type]="visibility.checked ? 'text' : 'password'"
    [formControl]="control"
    [attr.autocomplete]="autocomplete"
    [attr.placeholder]="'password.placeholder' | transloco"
  />
  <input
    #visibility
    type="checkbox"
    class="pwd-vis"
    [attr.aria-label]="
      (visibility.checked ? 'password.hide' : 'password.show') | transloco
    "
  />
  <span class="eye-icons text-secondary" aria-hidden="true">
    <app-icon class="eye-on" name="eye"></app-icon>
    <app-icon class="eye-off" name="eye-off"></app-icon>
  </span>
</div>
