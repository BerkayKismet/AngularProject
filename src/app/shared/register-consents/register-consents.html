<!-- İki varyant (switch: kurumsal kayıt, modal: kayıt) aynı yapıyı paylaşır; fark CSS sınıfı ve link ayraçtadır. -->
<ng-template #linkGap>
  <ng-container *ngIf="variant === 'switch'; else modalGap">{{ ' ' }}</ng-container>
  <ng-template #modalGap>{{ 'register.consentModal.gap' | transloco }}</ng-template>
</ng-template>

<div
  class="consents"
  [class.consents--switch]="variant === 'switch'"
  [class.consents--modal]="variant === 'modal'"
>
  <div class="form-check form-switch">
    <input
      id="consent-terms"
      type="checkbox"
      class="form-check-input cpointer"
      formControlName="termsAccepted"
    />
    <label
      for="consent-terms"
      class="form-check-label lh-1 cpointer" [class.fs-12]="variant === 'switch'"
      ><a href="#" (click)="$event.preventDefault()">{{ 'register.consentModal.cookie' | transloco }}</a
      ><ng-container *ngTemplateOutlet="linkGap"></ng-container
      ><a href="#" (click)="$event.preventDefault()">{{ 'register.consentModal.security' | transloco }}</a
      ><ng-container *ngTemplateOutlet="linkGap"></ng-container
      ><a href="#" (click)="$event.preventDefault()">{{ 'register.consentModal.membership' | transloco }}</a
      ><ng-container *ngTemplateOutlet="linkGap"></ng-container
      ><a href="#" (click)="$event.preventDefault()">{{ 'register.consentModal.potentialUser' | transloco }}</a
      ><ng-container *ngTemplateOutlet="linkGap"></ng-container
      ><a href="#" (click)="$event.preventDefault()">{{ 'register.consentModal.portal' | transloco }}</a
      >{{ 'register.consentModal.suffix' | transloco }}</label
    >
  </div>

  <div class="form-check form-switch">
    <input
      id="consent-marketing"
      type="checkbox"
      class="form-check-input cpointer"
      formControlName="marketingAccepted"
    />
    <label for="consent-marketing" class="form-check-label lh-1 cpointer" [class.fs-12]="variant === 'switch'"
      ><span>{{ 'register.consentModal.marketing' | transloco }}</span
      >{{ 'register.consentModal.suffix' | transloco }}</label
    >
  </div>

  <div class="form-check form-switch">
    <input
      id="consent-survey"
      type="checkbox"
      class="form-check-input cpointer"
      formControlName="surveyAccepted"
    />
    <label for="consent-survey" class="form-check-label lh-1 cpointer" [class.fs-12]="variant === 'switch'"
      ><span>{{ 'register.consentModal.survey' | transloco }}</span
      >{{ 'register.consentModal.suffix' | transloco }}</label
    >
  </div>
</div>
