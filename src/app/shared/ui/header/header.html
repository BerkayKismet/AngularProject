<!-- Üst bar: logo | arama | menü + kayıt butonu + kullanıcı.
     lg altında yalnızca logo + hamburger görünür; öğeler açılır panelde listelenir. -->
<header class="app-header d-flex align-items-center">
  <a routerLink="/" class="app-header__brand">
    <img class="app-header__logo" src="assets/images/gaboraslogo.png" alt="Gaboraş logosu" />
  </a>

  <input
    #menuToggle
    type="checkbox"
    id="app-header-toggle"
    class="app-header__toggle"
    aria-label="Menüyü aç/kapat"
  />
  <label for="app-header-toggle" class="app-header__burger ms-auto d-lg-none" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <div class="app-header__panel">
    <div class="app-header__search">
      <input
        type="search"
        class="form-control app-header__search-input"
        placeholder="Ara"
        aria-label="Ara"
      />
      <button type="button" class="app-header__search-btn" aria-label="Ara">
        <app-icon name="search"></app-icon>
      </button>
    </div>

    <nav class="app-header__nav ms-lg-auto d-flex align-items-lg-center">
      <a href="#" class="app-header__link">Ürünler</a>
      <a href="#" class="app-header__link">Ücretsiz İlan Ver</a>
      <a
        class="app-header__link"
        [routerLink]="[{ outlets: { modal: ['login'] } }]"
        (click)="closeMenu()"
      >
        Giriş Yap
      </a>
      <a href="#" class="app-header__signup btn">Ücretsiz Kayıt Ol</a>
      <span class="app-header__avatar" aria-label="Kullanıcı">TR</span>
    </nav>
  </div>
</header>
