<form class="d-flex flex-column gap-3" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <label class="visually-hidden" for="identifier">E-Posta Adresi veya GSM</label>
    <input
      id="identifier"
      class="form-control form-control-auth"
      type="text"
      formControlName="identifier"
      placeholder="E-Posta Adresi veya GSM"
      autocomplete="username"
    />
  </div>

  <app-password-field
    [control]="form.controls.password"
    inputId="password"
    autocomplete="current-password"
  ></app-password-field>

  <button
    type="button"
    class="forgot-link btn btn-link p-0 border-0 align-self-end fw-medium"
  >
    Şifreni mi unuttun?
  </button>

  <div
    class="auth-actions d-flex flex-column flex-sm-row-reverse justify-content-sm-between align-items-stretch align-items-sm-center gap-2 gap-sm-3"
  >
    <button type="submit" class="btn btn-auth btn-auth-primary">
      Giriş Yap
      <app-icon name="login" class="btn-icon btn-icon--login"></app-icon>
    </button>

    <a class="btn btn-auth btn-auth-gold" [routerLink]="registerLink">
      <app-icon name="chevron-left" class="btn-icon"></app-icon>
      Kayıt Ol
    </a>
  </div>
</form>

<div class="divider d-flex align-items-center gap-3 my-4">
  <hr />
  <span class="text-secondary small">veya Google ile giriş yap</span>
  <hr />
</div>

<app-google-signin-button (pressed)="onGoogleSignIn()"></app-google-signin-button>
